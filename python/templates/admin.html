<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistaar MCP Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --bg-surface: rgba(255, 255, 255, 0.03);
            --bg-surface-hover: rgba(255, 255, 255, 0.06);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --primary-hover-gradient: linear-gradient(135deg, #60a5fa, #a78bfa);
            --danger-gradient: linear-gradient(135deg, #ef4444, #f43f5e);
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --glass-blur: blur(12px);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px 0;
            box-shadow: 4px 0 24px rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 0 28px 32px;
            margin-bottom: 16px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 16px 28px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-main);
            padding-left: 32px; /* micro-animation */
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), transparent);
            color: #fff;
            border-left: 3px solid #3b82f6;
        }

        /* Main Content */
        .content {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            position: relative;
        }

        /* Glowing orb background effect */
        .content::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .tab-pane {
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography & Layout */
        h1 { margin-top: 0; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.5px; }
        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; }
        
        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Cards & Tables */
        .card {
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.12);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        tbody tr {
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }

        td { font-size: 0.95rem; }

        /* Forms & Buttons */
        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover { 
            background: var(--primary-hover-gradient);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }
        
        .btn:active { transform: translateY(0); }
        
        .btn-danger { background: var(--danger-gradient); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4); }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            box-shadow: none;
        }
        .btn-outline:hover { 
            background: var(--bg-surface-hover); 
            box-shadow: none;
            border-color: rgba(255,255,255,0.2);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            padding: 0;
        }
        
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-icon.danger { color: #f87171; }
        .btn-icon.danger:hover { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Checkbox Grid */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 14px;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 12px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .checkbox-item input[type="checkbox"] {
            accent-color: #3b82f6;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Badges */
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        
        .modal-large { max-width: 850px; }

        .key-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.15rem;
            word-break: break-all;
            margin: 24px 0;
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #34d399;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        /* Code Blocks */
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 24px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
        }
        
        code { font-family: inherit; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">Vistaar Admin</div>
        <div class="nav-item active" onclick="switchTab('providers')">🏢 Providers</div>
        <div class="nav-item" onclick="switchTab('roles')">🔐 Roles</div>
    </div>

    <!-- Main Content -->
    <div class="content">
        
        <!-- Providers Tab -->
        <div id="tab-providers" class="tab-pane active">
            <div class="header-action">
                <h1>Providers</h1>
                <button class="btn" onclick="openProviderModal()">+ Add Provider</button>
            </div>
            
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="providers-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Roles Tab -->
        <div id="tab-roles" class="tab-pane">
            <div class="header-action">
                <h1>Roles</h1>
                <button class="btn" onclick="openRoleModal()">+ Create Role</button>
            </div>
            
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Role Name</th>
                            <th>Tools Allowed</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="roles-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>



    <!-- Provider Modal -->
    <div id="provider-modal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-top:0">Add New Provider</h2>
            <div class="form-group">
                <label>Provider Name</label>
                <input type="text" id="provider-name" class="form-control" placeholder="e.g. Acme Corp">
            </div>
            <div class="form-group">
                <label>Assign Role</label>
                <select id="provider-role" class="form-control"></select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn" onclick="submitProvider()">Create & Generate Key</button>
            </div>
        </div>
    </div>

    <!-- Role Modal -->
    <div id="role-modal" class="modal-overlay">
        <div class="modal modal-large">
            <h2 style="margin-top:0">Create / Edit Role</h2>
            <div class="form-group">
                <label>Role Name (No spaces)</label>
                <input type="text" id="role-name" class="form-control" placeholder="e.g. weather_only">
            </div>
            <div class="form-group">
                <label>Select Tools</label>
                <div class="checkbox-grid" id="role-tools-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn" onclick="submitRole()">Save Role</button>
            </div>
        </div>
    </div>

    <!-- API Key Display Modal -->
    <div id="key-modal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-top:0; color: var(--success)">API Key Generated!</h2>
            <p>Please copy this key now. <b>It will not be shown again.</b></p>
            <div class="key-display" id="generated-key"></div>
            <button class="btn" style="width: 100%" onclick="closeModals()">I have copied the key</button>
        </div>
    </div>

    <script>
        let allTools = [];
        let allRoles = [];

        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tabId === 'providers') loadProviders();
            if(tabId === 'roles') loadRoles();
        }

        // Modals
        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.classList.remove('show');
                setTimeout(() => el.style.display = 'none', 300);
            });
        }

        async function openProviderModal() {
            document.getElementById('provider-name').value = '';
            
            // Populate roles dropdown
            const select = document.getElementById('provider-role');
            select.innerHTML = allRoles.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
            
            const modal = document.getElementById('provider-modal');
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('show'));
        }

        async function openRoleModal(roleName = '') {
            document.getElementById('role-name').value = roleName;
            document.getElementById('role-name').disabled = !!roleName; // Disable editing name if updating
            
            let checkedTools = [];
            if(roleName) {
                const role = allRoles.find(r => r.name === roleName);
                if(role) checkedTools = role.tools;
            }

            const grid = document.getElementById('role-tools-grid');
            grid.innerHTML = allTools.map(t => `
                <label class="checkbox-item">
                    <input type="checkbox" value="${t.name}" ${checkedTools.includes(t.name) ? 'checked' : ''}>
                    ${t.name}
                </label>
            `).join('');

            const modal = document.getElementById('role-modal');
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('show'));
        }

        // Data Fetching
        async function fetchAPI(url, options = {}) {
            try {
                const res = await fetch(url, options);
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'API Error');
                return data;
            } catch (err) {
                alert("Error: " + err.message);
                throw err;
            }
        }

        async function init() {
            allTools = await fetchAPI('/api/tools');
            loadRoles();
            loadProviders();
        }

        async function loadRoles() {
            allRoles = await fetchAPI('/api/roles');
            const tbody = document.getElementById('roles-tbody');
            tbody.innerHTML = allRoles.map(r => `
                <tr>
                    <td><strong>${r.name}</strong></td>
                    <td>${r.tools.length} tools allowed</td>
                    <td>
                        <div style="display: flex; gap: 8px; flex-wrap: nowrap; align-items: center;">
                            <button class="btn-icon" onclick="openRoleModal('${r.name}')" title="Edit Role">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            </button>
                            ${r.name !== 'internal' ? `
                            <button class="btn-icon danger" onclick="deleteRole('${r.name}')" title="Delete Role">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function loadProviders() {
            const providers = await fetchAPI('/api/providers');
            const tbody = document.getElementById('providers-tbody');
            tbody.innerHTML = providers.map(p => `
                <tr>
                    <td><strong>${p.name}</strong><br><small style="color:var(--text-muted)">${p.id}</small></td>
                    <td><span class="badge" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">${p.role}</span></td>
                    <td><span class="badge ${p.active ? 'badge-success' : 'badge-danger'}">${p.active ? 'Active' : 'Inactive'}</span></td>
                    <td>${new Date(p.created_at).toLocaleDateString()}</td>
                    <td>
                        <div style="display: flex; gap: 8px; flex-wrap: nowrap; align-items: center;">
                            <button class="btn-icon" onclick="toggleProvider('${p.id}', ${!p.active})" title="${p.active ? 'Deactivate' : 'Activate'}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                            </button>
                            <button class="btn-icon" onclick="regenerateKey('${p.id}')" title="Regenerate Key">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                            </button>
                            <button class="btn-icon danger" onclick="deleteProvider('${p.id}')" title="Delete Provider">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Actions
        async function submitRole() {
            const name = document.getElementById('role-name').value.trim();
            const checked = Array.from(document.querySelectorAll('#role-tools-grid input:checked')).map(cb => cb.value);
            
            if(!name || checked.length === 0) return alert("Enter name and select at least 1 tool.");

            const isUpdate = document.getElementById('role-name').disabled;
            await fetchAPI(`/api/roles${isUpdate ? '/'+name : ''}`, {
                method: isUpdate ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, tools: checked })
            });
            
            closeModals();
            loadRoles();
        }

        async function deleteRole(name) {
            if(!confirm(`Delete role ${name}?`)) return;
            await fetchAPI(`/api/roles/${name}`, { method: 'DELETE' });
            loadRoles();
        }

        async function submitProvider() {
            const name = document.getElementById('provider-name').value.trim();
            const role = document.getElementById('provider-role').value;
            
            if(!name || !role) return alert("Fill all fields.");

            const res = await fetchAPI('/api/providers', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, role })
            });
            
            closeModals();
            loadProviders();
            
            // Show one-time key
            document.getElementById('generated-key').innerText = res.api_key;
            const modal = document.getElementById('key-modal');
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('show'));
        }

        async function toggleProvider(id, active) {
            await fetchAPI(`/api/providers/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ active })
            });
            loadProviders();
        }

        async function deleteProvider(id) {
            if(!confirm(`Permanently delete provider ${id}?`)) return;
            await fetchAPI(`/api/providers/${id}`, { method: 'DELETE' });
            loadProviders();
        }

        async function regenerateKey(id) {
            if(!confirm(`Regenerate key for ${id}? The old key will immediately stop working.`)) return;
            const res = await fetchAPI(`/api/providers/${id}/regenerate`, { method: 'POST' });
            
            document.getElementById('generated-key').innerText = res.api_key;
            const modal = document.getElementById('key-modal');
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('show'));
        }

        // Boot
        init();
    </script>
</body>
</html>
