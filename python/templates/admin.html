<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistaar MCP Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">Vistaar Admin</div>
        <div class="nav-item active" onclick="switchTab('providers')">Providers</div>
        <div class="nav-item" onclick="switchTab('roles')">Roles</div>
    </div>

    <!-- Main Content -->
    <div class="content">
        
        <!-- Providers Tab -->
        <div id="tab-providers" class="tab-pane active">
            <div class="header-action">
                <h2>API Providers</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <input type="text" id="provider-search" class="form-control" placeholder="Search providers..." style="width: 250px; padding: 8px 12px; border-radius: 4px;">
                    <button class="btn" onclick="openProviderModal()">+ New Provider</button>
                </div>
            </div>
            
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="providers-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Roles Tab -->
        <div id="tab-roles" class="tab-pane">
            <div class="header-action">
                <h2>Access Roles</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <input type="text" id="role-search" class="form-control" placeholder="Search roles..." style="width: 250px; padding: 8px 12px; border-radius: 4px;">
                    <button class="btn" onclick="openRoleModal()">+ New Role</button>
                </div>
            </div>
            
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Role Name</th>
                            <th>Tools Allowed</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="roles-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>



    <!-- Provider Modal -->
    <div id="provider-modal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-top:0">Add New Provider</h2>
            <div class="form-group">
                <label>Provider Name</label>
                <input type="text" id="provider-name" class="form-control" placeholder="e.g. Acme Corp">
            </div>
            <div class="form-group">
                <label>Assign Role</label>
                <select id="provider-role" class="form-control"></select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn" onclick="submitProvider()">Create & Generate Key</button>
            </div>
        </div>
    </div>

    <!-- Role Modal -->
    <div id="role-modal" class="modal-overlay">
        <div class="modal modal-large">
            <h2 style="margin-top:0">Create / Edit Role</h2>
            <div class="form-group">
                <label>Role Name (No spaces)</label>
                <input type="text" id="role-name" class="form-control" placeholder="e.g. weather_only">
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="margin: 0;">Select Tools</label>
                    <input type="text" id="tool-search" class="form-control" placeholder="Search tools..." style="width: 250px; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px;">
                </div>
                <div class="checkbox-grid" id="role-tools-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px;">
                <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
                <button class="btn" onclick="submitRole()">Save Role</button>
            </div>
        </div>
    </div>

    <!-- API Key Display Modal -->
    <div id="key-modal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-top:0; color: var(--success)">API Key Generated!</h2>
            <p>Please copy this key now. <b>It will not be shown again.</b></p>
            <div class="key-display" id="generated-key"></div>
            <button class="btn" style="width: 100%" onclick="closeModals()">I have copied the key</button>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
